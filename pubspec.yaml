name: dulce_pecado_ltda
description: "Aplicación Flutter para venta de galletas artesanales con carrito y WhatsApp."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  url_launcher: ^6.3.0
  font_awesome_flutter: ^10.7.0
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - lib/assets/logo.png
    - lib/assets/galleta_cafe.jpg
    - lib/assets/galleta_bocadillo.jpg
    - lib/assets/galleta_whiskey.jpg
    - lib/assets/galleta_ron.jpg
    - lib/assets/galleta_aguardiente.jpg

